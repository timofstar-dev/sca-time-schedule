      const checkConflicts = (day, period, subjectId, teacherId, roomId, currentLessonId, targetClassIds = [], currentLessons = lessons, ignoreContinuousCheck = false) => {
        if (!teacherId || !roomId || targetClassIds.length === 0) return null;
        
        const subject = subjects.find(s => s.id === subjectId);
        if (!subject) return "유효하지 않은 과목입니다.";

        // 🚨 절대 규칙: 초등 수학/영어 연강 절대 금지 (최후의 보루 모드에서도 무조건 막음)
        const hasElem = targetClassIds.some(id => ['c1','c2','c3','c4','c5','c6'].includes(id));
        const isMathOrEng = subject.name === '수학' || subject.name === '영어';
        
        if (hasElem && isMathOrEng) {
           const isConsecutive = currentLessons.some(l => l.id !== currentLessonId && l.day === day && Math.abs(l.period - period) === 1 && l.subjectId === subjectId && l.classIds.some(cid => targetClassIds.includes(cid)));
           if (isConsecutive) return `초등 수학/영어는 절대 연강 금지입니다.`;
        }

        if (period === 0 && subject.name !== '공동체 예배' && subject.id !== 's0') return "0교시에는 '공동체 예배'만 배정할 수 있습니다.";
        if (period !== 0 && (subject.name === '공동체 예배' || subject.id === 's0')) return "'공동체 예배'는 0교시에만 배정할 수 있습니다.";
        if (roomId === 'r10' && subject.name !== '공동체 예배' && subject.id !== 's0') return "예배실은 예배 전용입니다.";

        if (hasElem && period > 6) return "초등과정(1~6학년)은 6교시까지만 배정 가능합니다.";

        const teacher = teachers.find(t => t.id === teacherId);
        if (!teacher) return "해당 교사를 찾을 수 없습니다.";
        if (teacher.unavailable.includes(`${day}-${period}`)) return `${teacher.name} 선생님은 해당 시간에 수업이 불가능하게 설정되어 있습니다.`;
        
        const classConflict = currentLessons.find(l => l.id !== currentLessonId && l.day === day && l.period === period && l.classIds.some(id => targetClassIds.includes(id)));
        if (classConflict) return `학생들은 이미 이 교시에 수업이 있습니다.`;

        if (!teacher.allowDoubleBooking) {
          const teacherDoubleBooked = currentLessons.find(l => l.teacherId === teacherId && l.day === day && l.period === period && l.id !== currentLessonId);
          if (teacherDoubleBooked) return `${teacher.name} 선생님은 이미 이 교시에 다른 반 수업이 있습니다.`;
        }
        
        if (useRoomConstraints) {
          const roomDoubleBooked = currentLessons.find(l => l.roomId === roomId && l.day === day && l.period === period && l.id !== currentLessonId);
          if (roomDoubleBooked) return `해당 장소는 이미 사용 중입니다. (기초정보 관리에서 중복 허용 가능)`;
        }

        // 연속 배정 허용치 제약 (파편화 모드에서는 이 부분만 무시됨)
        if (!ignoreContinuousCheck) {
            const lessonsToday = currentLessons.filter(l => l.id !== currentLessonId && l.day === day && l.subjectId === subjectId && l.classIds.some(cid => targetClassIds.includes(cid)));
            const dailyCount = lessonsToday.length;
            const contType = subject.continuousType || 'none';

            if (contType === 'none') {
              if (dailyCount >= 1) return `하루 배정 횟수(1시간) 초과`;
            } else if (contType === '2') {
              if (dailyCount >= 2) return `하루 최대 2시간 초과`;
            } else if (contType === '3') {
              if (dailyCount >= 3) return `하루 최대 3시간 초과`;
            }
        }

        return null;

        }

        const sourceIdx = dragState.draggedIdx;
        const targetIdx = index;
        
        if (sourceIdx !== targetIdx) {
          const reorderList = (list, setListFn) => {
            const newList = [...list];
            const [movedItem] = newList.splice(sourceIdx, 1);
            newList.splice(targetIdx, 0, movedItem);
            setListFn(newList);
          };

          if (type === 'teacher') reorderList(teachers, setTeachers);
          else if (type === 'class') reorderList(classes, setClasses);
          else if (type === 'room') reorderList(rooms, setRooms);
          else if (type === 'subject') reorderList(subjects, setSubjects);
        }
        setDragState({ type: null, draggedIdx: null, dragOverIdx: null });
      };

      useEffect(() => {
        if (!GAS_URL || GAS_URL.includes("여기에")) {
          setIsLoading(false); return;
        }
        fetch(`${GAS_URL}?t=${Date.now()}`)
          .then(res => res.json())
          .then(data => {
            if (data && data.classes && data.classes.length > 0) {
              setClasses(data.classes);
              const updatedSubjects = data.subjects.map(s => {
                 let contType = 'none';
                 if (s.continuousType) { contType = s.continuousType; } 
                 else if (s.allowContinuous) { contType = '2'; }
                 return { ...s, continuousType: contType, isHighPriority: !!s.isHighPriority };
              });
              const updatedTeachers = data.teachers.map(t => ({ ...t, allowDoubleBooking: !!t.allowDoubleBooking }));
              setSubjects(sortSubjectsList(updatedSubjects));
              setRooms(data.rooms);
              setTeachers(updatedTeachers);
              setLessons(data.lessons || []);
              if (data.useRoomConstraints !== undefined) setUseRoomConstraints(data.useRoomConstraints);
            }
            setIsLoading(false);
          })
          .catch(err => {
            console.error("로딩 실패:", err);
            setIsLoading(false);
          });
      }, []);

      useEffect(() => {
        if (assignModal.isOpen && assignForm.teacherId && assignForm.roomId) {
          setConflictError(checkConflicts(assignModal.day, assignModal.period, assignForm.subjectId, assignForm.teacherId, assignForm.roomId, assignModal.lesson?.id, assignForm.classIds));

      const loadExcelSample = () => {
        showConfirm("첨부해주신 엑셀 자료를 바탕으로 '예시 시간표'를 생성합니다.\n(기존 시간표는 덮어씌워집니다.)\n진행하시겠습니까?", () => {
          const sampleData = [
            { id: generateId(), classIds: ['c1', 'c2'], day: '월', period: 1, subjectId: 's1', teacherId: 't1', roomId: 'r1', note: '' }

      const exportToExcelCSV = () => {
        let csvContent = '\uFEFF'; 
        const exportClasses = classes.filter(c => c.name !== '유치'); 
        const header = ['요일/교시', ...classes.map(c => c.name)];
        csvContent += header.join(',') + '\n';

        DAYS.forEach(day => {
          PERIODS.forEach(period => {
            if (period === 0 && day !== '월') return; 
            let row = [`${day} ${period}교시`];
            classes.forEach(cls => {
              const cellLessons = lessons.filter(l => l.day === day && l.period === period && l.classIds.includes(cls.id));
              if (cellLessons.length > 0) {
                const cellText = cellLessons.map(l => {
                  const subName = subjects.find(s => s.id === l.subjectId)?.name || '';
                  const teacherName = teachers.find(t => t.id === l.teacherId)?.name || '';
                  const roomName = rooms.find(r => r.id === l.roomId)?.name || '';
                  return `${subName}(${teacherName}/${roomName})`;
                }).join('\n'); 
                row.push(`"${cellText.replace(/"/g, '""')}"`);
              } else {
                row.push("");
              }
            });
            csvContent += row.join(',') + '\n';
          });
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `SCA_전체시간표_${new Date().toISOString().slice(0, 10)}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        showAlert("전체 학년 시간표가 CSV 파일로 다운로드되었습니다.\n(다운로드된 파일을 구글 시트나 엑셀에서 열어보실 수 있습니다.)");
      };

      // 🚨 [핵심] 최적화된 딥러닝 5단계 마스터 알고리즘 
      const handleAutoAssign = () => {
        showConfirm("AI가 100회의 시뮬레이션을 통해 빈칸을 최소화합니다.\n초등 수학/영어 연강 금지, 예배실 보호 등 모든 예외규칙이 반영됩니다.\n\n진행하시겠습니까?", () => {
          setIsSimulating(true);
          setSimProgress(0);
          
          let bestSim = { lessons: [...lessons], assignCount: -1, totalTasks: 0, pendingTasks: [] };
          const TOTAL_SIMS = 100; 

          const runSimulationStep = (simIndex) => {
            if (simIndex >= TOTAL_SIMS || bestSim.assignCount === bestSim.totalTasks) {
              setLessons(bestSim.lessons);
              setIsSimulating(false);
              setSimProgress(0);
              
              let forcedNotices = [];
              
              // 장소 중복 체크
              const roomGroups = {};
              bestSim.lessons.forEach(l => {
                if (l.roomId === 'r10' || !l.roomId) return; 
                const key = `${l.day}-${l.period}-${l.roomId}`;
                if(!roomGroups[key]) roomGroups[key] = [];
                roomGroups[key].push(l);
              });
              Object.values(roomGroups).forEach(group => {
                if(group.length > 1) {
                   const subs = group.map(l => `${getEntityName(subjects, l.subjectId)}(${l.classIds.map(id=>getEntityName(classes, id).replace('학년','')).join(',')})`).join(', ');
                   forcedNotices.push(`🏢 [장소중복] ${group[0].day} ${group[0].period}교시 ${getEntityName(rooms, group[0].roomId)} ➔ ${subs}`);
                }
              });

              // 초등 연강 체크 (수학/영어 외의 과목이 연강된 경우 알려줌)
              const elemIds = ['c1','c2','c3','c4','c5','c6'];
              elemIds.forEach(cId => {
                DAYS.forEach(day => {
                  const dayLessons = bestSim.lessons.filter(l => l.day === day && l.classIds.includes(cId));
                  dayLessons.sort((a,b) => a.period - b.period);
                  for(let i=0; i<dayLessons.length - 1; i++) {
                    if (dayLessons[i+1].period - dayLessons[i].period === 1) {
                       const s1 = getEntityName(subjects, dayLessons[i].subjectId);
                       const s2 = getEntityName(subjects, dayLessons[i+1].subjectId);
                       // 수학/영어는 방어벽으로 원천차단되므로, 다른 과목이 연강된 것만 보고합니다.
                       if (s1 === s2 && s1 !== '수학' && s1 !== '영어') {
                         forcedNotices.push(`⚠️ [초등연강] ${day} ${dayLessons[i].period}-${dayLessons[i+1].period}교시 ${getEntityName(classes, cId)} ${s1}`);
                       }
                    }
                  }
                });
              });

              // 교사 중복 체크
              const teacherGroups = {};
              bestSim.lessons.forEach(l => {
                if(!l.teacherId) return;
                const key = `${l.day}-${l.period}-${l.teacherId}`;
                if(!teacherGroups[key]) teacherGroups[key] = [];
                teacherGroups[key].push(l);
              });
              Object.values(teacherGroups).forEach(group => {
                if(group.length > 1) {
                  const teacher = teachers.find(t => t.id === group[0].teacherId);
                  if (teacher && !teacher.allowDoubleBooking) {
                    const subs = group.map(l => `${getEntityName(subjects, l.subjectId)}(${l.classIds.map(id=>getEntityName(classes, id).replace('학년','')).join(',')})`).join(', ');
                    forcedNotices.push(`👨‍🏫 [교사중복] ${group[0].day} ${group[0].period}교시 ${teacher.name}T ➔ ${subs}`);
                  }
                }
              });
              
              forcedNotices = [...new Set(forcedNotices)];

              if (bestSim.assignCount === bestSim.totalTasks) {
                  let msg = `✨ 몬테카를로 최적화 성공!\n모든 남은 수업(${bestSim.totalTasks}개)이 완벽하게 배정되었습니다.`;
                  if (forcedNotices.length > 0) {
                    msg += `\n\n🚨 단, 공간/시간 부족으로 제약을 무시하고 억지로 배정된 항목이 있습니다:\n${forcedNotices.join('\n')}`;
                  }
                  showAlert(msg);
              } else {
                  let failedReasons = [];
                  bestSim.pendingTasks.forEach(t => {
                      const sub = subjects.find(s=>s.id===t.subjectId)?.name || '알수없음';
                      const cls = t.classIds.map(id => classes.find(c=>c.id===id)?.name.replace('학년','')).join(',');
                      const teacher = teachers.find(tc=>tc.id===t.teacherId);
                      
                      let reason = `[${cls}] ${sub} (${t.duration}H)`;
                      if (teacher) {
                          let availableCount = 0;
                          let intersectionCount = 0; 
                          
                          DAYS.forEach(d => {
                            PERIODS.forEach(p => {
                               if (p!==0 && p <= (t.classIds.some(id => ['c0','c1','c2','c3','c4','c5','c6'].includes(id)) ? 6 : 7)) {
                                  const tFree = !teacher.unavailable.includes(`${d}-${p}`) && !bestSim.lessons.some(l=>l.teacherId===teacher.id && l.day===d && l.period===p);
                                  const cFree = !t.classIds.some(cid => bestSim.lessons.some(l=>l.classIds.includes(cid) && l.day===d && l.period===p));
                                  
                                  if (tFree) availableCount++;
                                  if (tFree && cFree) intersectionCount++; 
                               }
                            });
                          });
                          
                          if (availableCount < t.duration) reason += ` ➔ ${teacher.name}T 개인 시간 부족 (남은시간: ${availableCount}H)`;
                          else if (intersectionCount < t.duration) reason += ` ➔ ❌ 교사와 학생의 빈 시간이 엇갈림 (동시 빈칸 없음)`;
                          else reason += ` ➔ 시간은 있으나 반/교실 중복 또는 초등 연강 제약 충돌`;
                      }
                      failedReasons.push(reason);
                  });
                  const uniqueFailed = [...new Set(failedReasons)];
                  
                  let msg = `총 ${bestSim.totalTasks}개 중 ${bestSim.assignCount}개 배정 성공.\n\n❌ 실패 원인 상세 분석:\n${uniqueFailed.join('\n')}`;
                  if (forcedNotices.length > 0) {
                    msg += `\n\n🚨 억지로 배정된 항목(중복/연강):\n${forcedNotices.join('\n')}`;
                  }
                  msg += `\n\n💡 팁: '시간이 엇갈림'으로 뜬 경우 해당 교사의 제약시간을 풀거나 중복 허용이 필요합니다.`;
                  showAlert(msg);
              }
              return;
            }

            let currentLessons = [...lessons];
            
            // 0차: 예배 강제 배정
            const worshipClasses = ['c1','c2','c3','c4','c5','c6','c7','c8','c9','c10','c11'];
            const worshipSub = subjects.find(s => s.id === 's0' || s.name === '공동체 예배');
            let worshipTeacher = worshipSub ? (teachers.find(t => t.assignments.some(a => a.subjectId === worshipSub.id)) || teachers.find(t => t.name.includes("손성")) || teachers[0]) : null;

            if (worshipSub && worshipTeacher) {
              DAYS.forEach(day => {
                const unassignedClasses = worshipClasses.filter(cId => !currentLessons.some(l => l.day === day && l.period === 0 && l.classIds.includes(cId)));
                if (unassignedClasses.length > 0) currentLessons.push({ id: generateId(), classIds: unassignedClasses, subjectId: worshipSub.id, teacherId: worshipTeacher.id, roomId: 'r10', day: day, period: 0, note: '전체예배' });
              });
            }

            let loopAssignCount = 0; let pendingTasks = []; let megaTasks = [];
            
            const getDifficultyScore = (task) => {
              let score = task.isHighPriority ? 10000 : 0; 
              const teacher = teachers.find(tc => tc.id === task.teacherId);
              if (teacher) {
                 score += teacher.unavailable.length * 200; 
                 const tTasks = teacher.assignments.reduce((acc, a) => acc + (a.classIds.length || 1), 0);
                 score += tTasks * 100;
              }
              score += task.duration * 3000 + task.classIds.length * 1000; 
              return score;
            };

            // 태스크 수집 (블록 단위)
            teachers.forEach(teacher => {
              teacher.assignments.forEach(assign => {
                if (assign.classIds.length > 0) {
                  const sub = subjects.find(s => s.id === assign.subjectId);
                  if (!sub || sub.id === 's0' || sub.name === '공동체 예배') return; 
                  
                  let needed = 0; assign.classIds.forEach(cId => { if ((sub.gradeHours[cId] || 0) > needed) needed = sub.gradeHours[cId]; });
                  const isMegaTask = teacher.allowDoubleBooking && assign.classIds.length > 1;
                  needed -= currentLessons.filter(l => l.subjectId === sub.id && l.teacherId === teacher.id && l.classIds.includes(assign.classIds[0])).length;
                  
                  if (needed > 0) {
                    const targetDuration = sub.continuousType === '3' ? 3 : (sub.continuousType === '2' ? 2 : 1);
                    const taskCount = Math.ceil(needed / targetDuration);
                    for(let i=0; i < taskCount; i++) {
                      let dur = (i === taskCount - 1 && needed % targetDuration !== 0) ? needed % targetDuration : targetDuration;
                      const taskObj = { id: generateId(), teacherId: teacher.id, subjectId: sub.id, classIds: assign.classIds, isHighPriority: !!sub.isHighPriority, duration: dur };
                      isMegaTask ? megaTasks.push({...taskObj, type: 'MEGA'}) : pendingTasks.push({...taskObj, type: 'STRICT'});
                    }
                  }
                }
              });
            });

            classes.forEach(cls => {
              subjects.forEach(sub => {
                const targetHours = sub.gradeHours[cls.id] || 0;
                if (targetHours > 0 && sub.id !== 's0' && sub.name !== '공동체 예배') {
                  const assigned = currentLessons.filter(l => l.classIds.includes(cls.id) && l.subjectId === sub.id).length;
                  const strictPlanned = pendingTasks.filter(t => t.type === 'STRICT' && t.subjectId === sub.id && t.classIds.includes(cls.id)).reduce((a, t) => a + t.duration, 0);
                  const megaPlanned = megaTasks.filter(t => t.subjectId === sub.id && t.classIds.includes(cls.id)).reduce((a, t) => a + t.duration, 0);
                  let needed = targetHours - (assigned + strictPlanned + megaPlanned);
                  
                  if (needed > 0) {
                    const flexTeachers = teachers.filter(t => t.assignments.some(a => a.subjectId === sub.id && a.classIds.length === 0));
                    if (flexTeachers.length > 0) {
                      const targetDuration = sub.continuousType === '3' ? 3 : (sub.continuousType === '2' ? 2 : 1);
                      const taskCount = Math.ceil(needed / targetDuration);
                      for(let i=0; i<taskCount; i++) {
                        let dur = (i === taskCount - 1 && needed % targetDuration !== 0) ? needed % targetDuration : targetDuration;
                        pendingTasks.push({ id: generateId(), type: 'FLEX', possibleTeacherIds: flexTeachers.map(t => t.id), subjectId: sub.id, classIds: [cls.id], isHighPriority: !!sub.isHighPriority, duration: dur });
                      }
                    }
                  }
                }
              });
            });

            const totalTasksCount = pendingTasks.reduce((a, t) => a + t.duration, 0) + megaTasks.reduce((a, t) => a + t.duration, 0);
            const roomIds = rooms.map(r => r.id);

            // 공통 배치 로직 
            const tryPlaceTask = (t, currentL, searchAllRooms, ignoreCont) => {
               const subObj = subjects.find(s=>s.id===t.subjectId);
               let placed = false;
               let shufD = [...DAYS].sort(() => Math.random() - 0.5);
               for (const day of shufD) {
                 let shufP = [...PERIODS].filter(p => p !== 0).sort(() => Math.random() - 0.5);
                 for (const startP of shufP) {
                    if (t.classIds.some(cid => currentL.some(l => l.day === day && l.period === startP && l.classIds.includes(cid)))) continue;
                    const defR = getDefaultRoomId(classGroups.find(g => g.classIds.includes(t.classIds[0]))?.id) || rooms[0].id;
                    const cRooms = searchAllRooms ? roomIds.filter(id=>id!=='r10') : getPreferredRooms(subObj, t.classIds, defR, roomIds);
                    
                    let tId = t.type === 'STRICT' || t.type === 'MEGA' ? t.teacherId : t.possibleTeacherIds.find(tid => !checkConflicts(day, startP, t.subjectId, tid, cRooms[0], null, t.classIds, currentL, ignoreCont));
                    if (!tId) continue;

                    let canBlock = true; let tBlock = [];
                    for (let dur = 0; dur < t.duration; dur++) {
                      const cp = startP + dur; 
                      if (cp > (t.classIds.some(id => ['c0','c1','c2','c3','c4','c5','c6'].includes(id)) ? 6 : 7)) { canBlock = false; break; }
                      
                      let isClearForP = true; let indL = [];
                      if(t.type === 'MEGA') {
                         for (const cid of t.classIds) {
                            const dRoom = getDefaultRoomId(classGroups.find(g => g.classIds.includes(cid))?.id) || rooms[0].id;
                            const mRooms = getPreferredRooms(subObj, [cid], dRoom, roomIds);
                            let fRoom = null; for(const r of mRooms) { if (!checkConflicts(day, cp, t.subjectId, tId, r, null, [cid], [...currentL, ...tBlock, ...indL], ignoreCont)) { fRoom = r; break; } }
                            if(fRoom) indL.push({ id: generateId(), classIds: [cid], subjectId: t.subjectId, teacherId: tId, roomId: fRoom, day, period: cp, note: '' });
                            else { isClearForP = false; break; }
                         }
                      } else {
                         let fR = null; for(const r of cRooms) { if (!checkConflicts(day, cp, t.subjectId, tId, r, null, t.classIds, [...currentL, ...tBlock], ignoreCont)) { fR = r; break; } }
                         if(fR) indL.push({ id: generateId(), classIds: t.classIds, subjectId: t.subjectId, teacherId: tId, roomId: fR, day, period: cp, note: '' });
                         else isClearForP = false;
                      }
                      if (!isClearForP) { canBlock = false; break; }
                      tBlock.push(...indL);
                    }
                    if (canBlock) { currentL.push(...tBlock); loopAssignCount += t.duration; placed = true; break; }
                 }
                 if(placed) break;
               }
               return placed;
            };

            // 1차: 메가, 크로스합반, 우선순위 
            let remainM = []; megaTasks.sort((a,b) => getDifficultyScore(b) - getDifficultyScore(a) + (Math.random() * 200 - 100));
            megaTasks.forEach(t => { if(!tryPlaceTask(t, currentLessons, false, false)) remainM.push(t); });
            megaTasks = remainM;

            let remainP = []; pendingTasks.sort((a,b) => getDifficultyScore(b) - getDifficultyScore(a) + (Math.random() * 200 - 100));
            pendingTasks.forEach(t => { if(t.isHighPriority || t.classIds.length > 1) { if(!tryPlaceTask(t, currentLessons, false, false)) remainP.push(t); } else { remainP.push(t); }});
            pendingTasks = remainP;

            // 2차: 일반 배정 
            remainP = []; pendingTasks.forEach(t => { if(!tryPlaceTask(t, currentLessons, false, false)) remainP.push(t); }); pendingTasks = remainP;

            // 3차: 최후 파편화 밀어넣기 
            let frag = []; pendingTasks.forEach(t => { for (let i=0; i<t.duration; i++) frag.push({...t, id:generateId(), duration:1}); });
            frag.sort((a,b) => getDifficultyScore(b) - getDifficultyScore(a) + (Math.random() * 50 - 25));
            remainP = []; 
            frag.forEach(t => { 
                if(!tryPlaceTask(t, currentLessons, true, true)) remainP.push(t); 
            });
            pendingTasks = remainP;

            const finalPending = [...megaTasks, ...pendingTasks];
            if (loopAssignCount > bestSim.assignCount) bestSim = { lessons: currentLessons, assignCount: loopAssignCount, totalTasks: totalTasksCount, pendingTasks: finalPending };

                  </select>

                        const target = s.gradeHours[cId] || 0;
                        const assigned = lessons.filter(l => l.classIds.includes(cId) && l.subjectId === s.id).length;
                        const badgeClass = assigned === target ? 'bg-green-100 border-green-300 text-green-800 font-bold' : assigned > target ? 'bg-red-100 border-red-300 text-red-800 font-bold' : assigned === 0 ? 'bg-gray-100 border-gray-200 text-gray-400' : 'bg-white border-gray-300 text-gray-600';

                                    </div>
                                    <div className={`text-[10px] ${tColor.label} flex justify-between items-center`}>
                                      <span className="truncate mr-1"><Users className="w-2.5 h-2.5 inline"/> {getEntityName(teachers, lesson.teacherId)}</span>

                                    </div>
                                  </div>
                                );
                              })}

                            </div>
                          </td>
                        );
                      })}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

        return (

                <button onClick={() => { setViewType('class'); setSelectedViewTarget(classGroups[1]?.id); }} className={`px-4 py-2 rounded-lg font-medium whitespace-nowrap ${isClassView ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>편제별 조회</button>
                <button onClick={() => { setViewType('teacher'); setSelectedViewTarget(teachers[0]?.id); }} className={`px-4 py-2 rounded-lg font-medium whitespace-nowrap ${!isClassView ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>교사별 조회</button>
              </div>
              <div className="flex gap-2 items-center">
                <select value={activeTargetId} onChange={(e) => setSelectedViewTarget(e.target.value)} className="p-2 border border-gray-300 rounded-lg bg-white w-full md:w-auto">
                  {targets.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                </select>

              <thead><tr><th className="w-14 p-2 border-2 border-gray-300 bg-gray-100 text-gray-800 print:border-black">교시</th>{DAYS.map(day => <th key={day} className="p-2 border-2 border-gray-300 bg-gray-100 text-gray-800 font-bold text-base print:border-black">{day}</th>)}</tr></thead>
              <tbody>
                {PERIODS.map(period => (
                  <tr key={period}>
                    <td className="p-2 border-2 border-gray-300 bg-gray-50 text-center font-bold text-gray-600 print:border-black print:text-black">{period}</td>
                    {DAYS.map(day => {
                      const cellLessons = isClassView ? getLessonsForGroup(activeTargetId, day, period) : getLessonsForTeacher(activeTargetId, day, period);
                      return (
                        <td key={`${day}-${period}`} className="border-2 border-gray-300 p-1 align-top print:border-black h-20">
                          <div className="flex flex-col gap-1 h-full justify-center">
                            {cellLessons.length > 0 ? cellLessons.map((lesson, idx) => {
                              const tColor = getTeacherColor(lesson.teacherId);
                              return (
                                <div key={idx} className={`flex flex-col items-center justify-center p-1 ${tColor.bg} print:bg-transparent rounded border ${tColor.border} print:border-none`}>
                                  <span className={`font-bold text-[11px] md:text-sm ${tColor.text} print:text-black text-center leading-tight`}>
                                    {lesson.note ? <span className="opacity-75 mr-0.5 whitespace-nowrap">[{lesson.note}]</span> : <span className="opacity-75 mr-0.5 whitespace-nowrap">[{formatClassNames(lesson.classIds)}]</span>}
                                    <span className="break-keep">{getEntityName(subjects, lesson.subjectId)}</span>
                                  </span>
                                  <span className={`text-[10px] ${tColor.label} mt-0.5 print:text-black text-center break-keep`}>{isClassView ? `${getEntityName(teachers, lesson.teacherId)} / ${getEntityName(rooms, lesson.roomId)}` : `${formatClassNames(lesson.classIds)} / ${getEntityName(rooms, lesson.roomId)}`}</span>
                                </div>
                              );
                            }) : <div className="text-center text-gray-200 print:hidden">-</div>}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans print:bg-white relative">
          <nav className="bg-indigo-600 text-white p-4 shadow-md print:hidden">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-2"><SettingsIcon className="w-6 h-6" /><h1 className="text-2xl font-bold break-keep">SCA 시간표 관리시스템</h1></div>
              <div className="flex items-center gap-4 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                <div className="flex gap-2 items-center">
                  <button onClick={saveToServer} className="flex items-center gap-1 px-3 py-1.5 bg-emerald-500 hover:bg-emerald-400 rounded-md text-sm font-bold transition-colors shadow whitespace-nowrap" title="현재 상태를 서버에 영구 저장합니다"><Cloud className="w-4 h-4 shrink-0" /> 서버에 저장</button>
                  <div className="w-px h-6 bg-indigo-400 mx-1"></div>
                  <button onClick={exportData} className="flex items-center gap-1 px-3 py-1.5 bg-indigo-500 hover:bg-indigo-400 rounded-md text-sm font-medium transition-colors whitespace-nowrap" title="PC로 파일 백업"><Download className="w-4 h-4 shrink-0" /> PC 저장</button>
                  <button onClick={() => fileInputRef.current?.click()} className="flex items-center gap-1 px-3 py-1.5 bg-indigo-500 hover:bg-indigo-400 rounded-md text-sm font-medium transition-colors whitespace-nowrap" title="PC에서 파일 열기"><Upload className="w-4 h-4 shrink-0" /> PC 열기</button>
                  <input type="file" ref={fileInputRef} onChange={importData} accept=".json" className="hidden" />
                </div>
                <div className="w-px h-6 bg-indigo-400 mx-2 hidden md:block"></div>
                <div className="flex gap-2 bg-indigo-700/50 p-1 rounded-lg">
                  <button onClick={() => setActiveTab('basic')} className={`px-4 py-2 rounded-md font-medium transition-colors whitespace-nowrap ${activeTab === 'basic' ? 'bg-white text-indigo-700 shadow' : 'hover:bg-indigo-500 text-indigo-50'}`}>기초정보 관리</button>
                  <button onClick={() => setActiveTab('schedule')} className={`px-4 py-2 rounded-md font-medium transition-colors whitespace-nowrap ${activeTab === 'schedule' ? 'bg-white text-indigo-700 shadow' : 'hover:bg-indigo-500 text-indigo-50'}`}>시간표 배정</button>
                  <button onClick={() => setActiveTab('view')} className={`px-4 py-2 rounded-md font-medium transition-colors whitespace-nowrap ${activeTab === 'view' ? 'bg-white text-indigo-700 shadow' : 'hover:bg-indigo-500 text-indigo-50'}`}>통합 조회</button>

          </main>

          {/* 모달 2: 시간표 배정 (수동 배정 및 분/합반 체크박스) */}
          {assignModal.isOpen && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 animate-in fade-in duration-200">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                <div className="bg-gray-50 border-b border-gray-200 p-4 flex justify-between items-center">
                  <h3 className="font-bold text-lg text-gray-800 break-keep">{classGroups.find(g=>g.id===selectedGroupId)?.name} - {assignModal.day}요일 {assignModal.period}교시</h3>
                  <button onClick={() => setAssignModal({ isOpen: false, isNew: false, day: '', period: '', lesson: null })} className="text-gray-400 hover:text-gray-600"><XIcon className="w-5 h-5" /></button>
                </div>
                <div className="p-6 space-y-5">
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-2 whitespace-nowrap">대상 학년 <span className="text-xs font-normal text-indigo-600 ml-1 break-keep">(분반/합반 선택)</span></label>
                    <div className="flex flex-wrap gap-2">
                      {(classGroups.find(g=>g.id===selectedGroupId)?.classIds || []).map(cId => (
                        <label key={cId} className={`flex items-center gap-1.5 text-sm cursor-pointer px-3 py-1.5 rounded-lg border transition-colors whitespace-nowrap ${assignForm.classIds.includes(cId) ? 'bg-indigo-50 border-indigo-300 text-indigo-800 font-medium' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}`}>
                          <input type="checkbox" checked={assignForm.classIds.includes(cId)} onChange={(e) => {
                            const newIds = e.target.checked ? [...assignForm.classIds, cId] : assignForm.classIds.filter(id => id !== cId);
                            setAssignForm(prev => ({...prev, classIds: newIds}));
                          }} className="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4 shrink-0" />
                          {getEntityName(classes, cId)}
                        </label>
                      ))}
                    </div>
                    {assignForm.classIds.length === 0 && <p className="text-xs text-red-500 mt-1 break-keep">대상이 될 학년을 최소 1개 이상 선택해주세요.</p>}
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1 break-keep">분반 메모 (선택사항)</label>
                    <input type="text" placeholder="예: 특강, A반 등 짧게" className="w-full p-2 border border-gray-300 rounded-lg bg-white outline-none focus:ring-2 focus:ring-indigo-500 text-sm" value={assignForm.note} onChange={e => setAssignForm(prev => ({...prev, note: e.target.value}))} />
                  </div>
                  <div><label className="block text-sm font-bold text-gray-700 mb-1 whitespace-nowrap">과목 선택</label><select className="w-full p-3 border border-gray-300 rounded-lg bg-white" value={assignForm.subjectId} onChange={e => setAssignForm(prev => ({...prev, subjectId: e.target.value}))}><option value="">과목을 선택하세요</option>{subjects.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
                  <div><label className="block text-sm font-bold text-gray-700 mb-1 whitespace-nowrap">담당 교사</label><select className="w-full p-3 border border-gray-300 rounded-lg bg-white" value={assignForm.teacherId} onChange={e => setAssignForm(prev => ({...prev, teacherId: e.target.value}))}><option value="">교사를 선택하세요</option>{teachers.slice().sort((a, b) => { if (!assignForm.subjectId) return 0; const aMatch = a.assignments.some(assign => assign.subjectId === assignForm.subjectId && (assign.classIds.length === 0 || assignForm.classIds.every(cid => assign.classIds.includes(cid)))); const bMatch = b.assignments.some(assign => assign.subjectId === assignForm.subjectId && (assign.classIds.length === 0 || assignForm.classIds.every(cid => assign.classIds.includes(cid)))); return (bMatch === aMatch) ? 0 : bMatch ? 1 : -1; }).map(t => {
                    const isMatch = assignForm.subjectId && t.assignments.some(assign => assign.subjectId === assignForm.subjectId && (assign.classIds.length === 0 || assignForm.classIds.some(cid => assign.classIds.includes(cid))));
                    const subjectNames = Array.from(new Set(t.assignments.map(a => getEntityName(subjects, a.subjectId)))).join(', ');
                    return <option key={t.id} value={t.id}>{t.name} ({subjectNames || '과목없음'}) {isMatch ? '⭐ 권장' : ''}</option>;
                  })}</select></div>
                  <div><label className="block text-sm font-bold text-gray-700 mb-1 whitespace-nowrap">수업 장소</label><select className="w-full p-3 border border-gray-300 rounded-lg bg-white" value={assignForm.roomId} onChange={e => setAssignForm(prev => ({...prev, roomId: e.target.value}))}><option value="">장소를 선택하세요</option>{rooms.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}</select></div>
                  {conflictError && <div className="bg-red-50 border border-red-200 text-red-700 p-3 rounded-lg flex gap-2 items-start text-sm break-keep"><AlertTriangle className="w-5 h-5 shrink-0 text-red-500" /><span><b>배정 불가:</b> {conflictError}</span></div>}
                </div>
                <div className="p-4 border-t border-gray-100 flex justify-between bg-gray-50">{!assignModal.isNew && assignModal.lesson ? <button onClick={handleDeleteLesson} className="flex items-center gap-1 px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg font-medium whitespace-nowrap"><Trash2 className="w-4 h-4 shrink-0" /> 삭제</button> : <div></div>}<div className="flex gap-2"><button onClick={() => setAssignModal({ isOpen: false, isNew: false, day: '', period: '', lesson: null })} className="px-4 py-2 text-gray-600 hover:bg-gray-200 rounded-lg font-medium whitespace-nowrap">취소</button><button onClick={handleSaveLesson} disabled={!!conflictError || !assignForm.subjectId || !assignForm.teacherId || !assignForm.roomId || assignForm.classIds.length === 0} className={`px-6 py-2 rounded-lg font-medium shadow-sm whitespace-nowrap ${conflictError || !assignForm.subjectId || !assignForm.teacherId || !assignForm.roomId || assignForm.classIds.length === 0 ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}`}>저장</button></div></div>
              </div>
            </div>
          )}

          {/* 모달 1: 교사 제약사항 */}
          {constraintModal.isOpen && constraintModal.teacher && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 animate-in fade-in duration-200">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
                <div className="bg-indigo-600 p-4 text-white flex justify-between items-center"><h3 className="font-bold text-lg break-keep">{constraintModal.teacher.name} 선생님 제약시간 설정</h3><button onClick={() => setConstraintModal({ isOpen: false, teacher: null })}><XIcon className="w-5 h-5"/></button></div>
                <div className="p-4">
                  <p className="text-sm text-gray-600 mb-4 bg-yellow-50 p-3 rounded border border-yellow-200 break-keep">수업이 <b>불가능한</b> 시간을 클릭하여 빨간색(X)으로 만드세요.</p>
                  <table className="w-full border-collapse">
                    <thead><tr><th className="p-2 border bg-gray-100">교시</th>{DAYS.map(d => <th key={d} className="p-2 border bg-gray-100">{d}</th>)}</tr></thead>
                    <tbody>
                      {PERIODS.map(p => (
                        <tr key={p}>
                          <td className="p-2 border bg-gray-50 text-center text-sm font-bold">{p}</td>
                          {DAYS.map(d => {
                            const isUnavailable = teachers.find(t => t.id === constraintModal.teacher.id)?.unavailable.includes(`${d}-${p}`);
                            return <td key={`${d}-${p}`} onClick={() => toggleTeacherConstraint(d, p)} className={`p-0 border cursor-pointer transition-colors ${isUnavailable ? 'bg-red-100' : 'hover:bg-gray-100'}`}><div className="h-10 flex items-center justify-center">{isUnavailable ? <XIcon className="w-5 h-5 text-red-500"/> : <CheckCircle className="w-4 h-4 text-green-200"/>}</div></td>
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <div className="mt-6 flex justify-end"><button onClick={() => setConstraintModal({ isOpen: false, teacher: null })} className="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 whitespace-nowrap">확인</button></div>
                </div>
              </div>
            </div>
          )}

          {/* 모달 3: 교사 정보 편집 */}
          {teacherModal.isOpen && teacherModal.teacher && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 animate-in fade-in duration-200">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
                <div className="bg-indigo-600 p-4 text-white flex justify-between items-center shrink-0"><h3 className="font-bold text-lg whitespace-nowrap">{teacherModal.isNew ? '새 교사 등록' : '교사 정보 수정'}</h3><button onClick={() => setTeacherModal({ isOpen: false, isNew: false, teacher: null })}><XIcon className="w-5 h-5"/></button></div>
                <div className="p-6 space-y-6 overflow-y-auto">
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1 whitespace-nowrap">교사명</label>
                    <input type="text" placeholder="예: 한명옥" className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none mb-4" value={teacherModal.teacher.name} onChange={e => setTeacherModal(prev => ({ ...prev, teacher: { ...prev.teacher, name: e.target.value } }))} />
                    
                    <label className="flex items-center gap-2 text-[13px] sm:text-sm font-bold text-indigo-700 cursor-pointer bg-indigo-50 p-3 rounded-lg border border-indigo-200 mt-2 mb-4">
                      <input 
                        type="checkbox" 
                        checked={teacherModal.teacher.allowDoubleBooking || false}
                        onChange={e => setTeacherModal(prev => ({ 
                          ...prev, 
                          teacher: { ...prev.teacher, allowDoubleBooking: e.target.checked } 
                        }))}
                        className="w-4 h-4 text-indigo-600 focus:ring-indigo-500 rounded border-gray-300"
                      />
                      <span className="break-keep">동시간대 중복 수업 허용 (외부강사팀 / 다중 교실 진행 시 체크)</span>
                    </label>

                    <label className="block text-sm font-bold text-gray-700 mb-2 whitespace-nowrap">시간표 표시 색상</label>
                    <div className="flex flex-wrap gap-2">
                      {TEACHER_COLORS.map(c => (
                        <button
                          key={c.id}
                          onClick={() => setTeacherModal(prev => ({ ...prev, teacher: { ...prev.teacher, color: c.id } }))}
                          className={`w-8 h-8 rounded-full ${c.bg} border-2 transition-transform shrink-0 ${teacherModal.teacher.color === c.id ? c.border + ' scale-110 shadow-md' : 'border-transparent hover:scale-105'}`}
                          title="색상 선택"
                          type="button"
                        />
                      ))}
                    </div>
                  </div>
                  <div>
                    <div className="flex flex-wrap justify-between items-center gap-2 mb-2">
                      <label className="block text-[13px] sm:text-sm font-bold text-gray-700 break-keep">담당 과목 및 담당 편제(복수학년)</label>
                      <button onClick={() => { setTeacherModal(prev => ({ ...prev, teacher: { ...prev.teacher, assignments: [...prev.teacher.assignments, { subjectId: subjects[0]?.id || '', classIds: [] }] } })) }} className="shrink-0 text-xs bg-indigo-100 text-indigo-700 px-2 py-1.5 rounded hover:bg-indigo-200 font-medium transition-colors flex items-center gap-1 whitespace-nowrap"><Plus className="w-3 h-3 shrink-0"/> 과목 추가</button>
                    </div>
                    <div className="space-y-3">
                      {teacherModal.teacher.assignments.map((assignment, index) => (
                        <div key={index} className="p-4 border border-gray-200 rounded-xl bg-gray-50 relative group shadow-sm">
                          <button onClick={() => { const newAssignments = [...teacherModal.teacher.assignments]; newAssignments.splice(index, 1); setTeacherModal(prev => ({ ...prev, teacher: { ...prev.teacher, assignments: newAssignments } })) }} className="absolute top-3 right-3 text-gray-400 hover:text-red-500 p-1"><XIcon className="w-4 h-4" /></button>
                          <div className="mb-3 w-5/6">
                            <select className="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-white font-medium text-indigo-900 focus:ring-2 focus:ring-indigo-500 outline-none" value={assignment.subjectId} onChange={(e) => { const newAssignments = [...teacherModal.teacher.assignments]; newAssignments[index].subjectId = e.target.value; setTeacherModal(prev => ({ ...prev, teacher: { ...prev.teacher, assignments: newAssignments } })); }}>
                              <option value="">과목을 선택하세요</option>{subjects.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                            </select>
                          </div>
                          <div>
                             <p className="text-[11px] sm:text-xs font-bold text-gray-600 mb-2 break-keep">해당 과목을 가르치는 반(복수학급 편제)</p>
                             <div className="flex flex-wrap gap-1.5">
                               {classes.map(c => (
                                 <label key={c.id} className={`flex items-center gap-1.5 text-xs cursor-pointer px-2 py-1.5 rounded border transition-colors whitespace-nowrap ${assignment.classIds.includes(c.id) ? 'bg-blue-50 border-blue-200 text-blue-800 font-medium' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-100'}`}>
                                   <input type="checkbox" checked={assignment.classIds.includes(c.id)} onChange={(e) => { const newAssignments = [...teacherModal.teacher.assignments]; if (e.target.checked) newAssignments[index].classIds.push(c.id); else newAssignments[index].classIds = newAssignments[index].classIds.filter(id => id !== c.id); setTeacherModal(prev => ({ ...prev, teacher: { ...prev.teacher, assignments: newAssignments } })); }} className="rounded text-blue-600 focus:ring-blue-500 w-3 h-3 shrink-0" /> {c.name}
                                 </label>
                               ))}
                             </div>
                          </div>
                        </div>
                      ))}
                      {teacherModal.teacher.assignments.length === 0 && <div className="text-sm text-gray-500 text-center py-8 border-2 border-dashed border-gray-300 rounded-xl bg-gray-50 flex flex-col items-center gap-2 break-keep"><BookOpen className="w-6 h-6 text-gray-300"/><span>우측 상단의 '+ 과목 추가' 버튼을 눌러<br/>담당 과목과 학급을 설정하세요.</span></div>}
                    </div>
                  </div>
                </div>
                <div className="p-4 border-t border-gray-100 flex justify-end gap-2 bg-gray-50 shrink-0">
                  <button onClick={() => setTeacherModal({ isOpen: false, isNew: false, teacher: null })} className="px-4 py-2 text-gray-600 hover:bg-gray-200 rounded-lg font-medium whitespace-nowrap">취소</button>
                  <button onClick={() => handleEditTeacherSave(teacherModal.teacher)} className="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium shadow-sm whitespace-nowrap">저장하기</button>
                </div>
              </div>
            </div>
          )}

          {/* 모달 4: 과목 정보 및 학년별 시수 편집 */}
          {editSubjectModal.isOpen && editSubjectModal.subject && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 animate-in fade-in duration-200">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
                <div className="bg-orange-500 p-4 text-white flex justify-between items-center shrink-0"><h3 className="font-bold text-lg break-keep">과목 및 개별학년별 시수 설정</h3><button onClick={() => setEditSubjectModal({ isOpen: false, subject: null })}><XIcon className="w-5 h-5"/></button></div>
                <div className="p-6 space-y-6 overflow-y-auto">
                  <div>
                    <label className="block text-sm font-bold text-gray-700 mb-1 whitespace-nowrap">과목명</label>
                    <input type="text" className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none font-medium mb-2" value={editSubjectModal.subject.name} onChange={e => setEditSubjectModal(prev => ({ ...prev, subject: { ...prev.subject, name: e.target.value } }))} />
                    
                    <label className="flex items-center gap-2 text-[13px] sm:text-sm font-bold text-rose-700 cursor-pointer bg-rose-50 p-3 rounded-lg border border-rose-200 mt-2">
                      <input 
                        type="checkbox" 
                        checked={editSubjectModal.subject.isHighPriority || false}
                        onChange={e => setEditSubjectModal(prev => ({ 
                          ...prev, 
                          subject: { ...prev.subject, isHighPriority: e.target.checked } 
                        }))}
                        className="w-4 h-4 text-rose-600 focus:ring-rose-500 rounded border-gray-300"
                      />
                      <span className="break-keep">⭐ 최우선 배정 (교사 제약이 심해 가장 먼저 배정되어야 하는 과목)</span>
                    </label>

                    <div className="mt-3 bg-indigo-50 p-3 rounded-lg border border-indigo-200">
                      <label className="block text-[13px] sm:text-sm font-bold text-indigo-700 mb-2">연속 수업 설정 (일별 최대치)</label>
                      <select 
                        className="w-full p-2 border border-indigo-300 rounded text-sm outline-none bg-white font-medium" 
                        value={editSubjectModal.subject.continuousType || 'none'} 
                        onChange={e => setEditSubjectModal(prev => ({ ...prev, subject: { ...prev.subject, continuousType: e.target.value } }))}
                      >
                        <option value="none">하루 1시간 (연속 불가)</option>
                        <option value="2">하루 최대 2시간 (연속 배정 필수)</option>
                        <option value="3">하루 최대 3시간 (연속 배정 필수)</option>
                      </select>
                    </div>
                  </div>
                  
                  <div>
                    <div className="flex flex-wrap justify-between items-center gap-2 mb-3 mt-4">
                       <label className="block text-[13px] sm:text-sm font-bold text-gray-700 break-keep">개별학년별 주당 목표 시수</label>
                       <button onClick={() => {
                          const hours = window.prompt("모든 학년에 일괄 적용할 시수를 숫자로 입력하세요.", "2");
                          const numHours = Number(hours);
                          if (hours !== null && !isNaN(numHours) && numHours >= 0) {
                             const newGradeHours = {}; classes.forEach(c => newGradeHours[c.id] = numHours);
                             setEditSubjectModal(prev => ({ ...prev, subject: { ...prev.subject, gradeHours: newGradeHours } }));
                          }
                       }} className="shrink-0 text-xs text-orange-600 hover:bg-orange-50 px-2 py-1 rounded transition-colors border border-orange-200 whitespace-nowrap">전체 일괄 입력</button>
                    </div>
                    
                    <p className="text-xs text-gray-500 mb-3 bg-gray-50 p-2 rounded break-keep">
                       시수를 <b>0</b>으로 설정하거나 비워두면, 해당 학년의 대시보드에 나타나지 않습니다.
                    </p>

                    <div className="grid grid-cols-2 gap-3 max-h-60 overflow-y-auto pr-2 pb-2">
                      {classes.map(c => (
                         <div key={c.id} className="flex items-center justify-between border border-gray-200 rounded-lg p-2 bg-white">
                            <span className="text-sm font-medium text-gray-700 pl-1 break-keep">{c.name}</span>
                            <div className="flex items-center bg-gray-50 border border-gray-300 rounded-md overflow-hidden w-16 shrink-0">
                               <input type="number" min="0" max="15" className="w-full p-1.5 text-center text-sm outline-none bg-transparent" placeholder="0" 
                                  value={editSubjectModal.subject.gradeHours[c.id] === undefined ? '' : editSubjectModal.subject.gradeHours[c.id]} 
                                  onChange={e => {
                                     const val = e.target.value === '' ? '' : Number(e.target.value);
                                     setEditSubjectModal(prev => ({
                                        ...prev, subject: { ...prev.subject, gradeHours: { ...prev.subject.gradeHours, [c.id]: val } }
                                     }));
                                  }} 
                               />
                            </div>
                         </div>
                      ))}
                    </div>
                  </div>
                </div>
                <div className="p-4 border-t border-gray-100 flex justify-end gap-2 bg-gray-50 shrink-0">
                  <button onClick={() => setEditSubjectModal({ isOpen: false, subject: null })} className="px-4 py-2 text-gray-600 hover:bg-gray-200 rounded-lg font-medium whitespace-nowrap">취소</button>
                  <button onClick={() => handleEditSubjectSave(editSubjectModal.subject)} className="px-6 py-2 bg-orange-50 hover:bg-orange-600 text-white rounded-lg font-medium shadow-sm whitespace-nowrap">수정 완료</button>
                </div>
              </div>
            </div>
          )}

          {/* 모달 5: 자체 디자인 다이얼로그 */}
          {dialog.isOpen && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-[60] animate-in fade-in duration-200">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden p-6 text-center animate-in zoom-in-95">
                <div className="mb-4 flex justify-center">{dialog.type === 'confirm' ? <AlertTriangle className="w-10 h-10 text-yellow-500" /> : <CheckCircle className="w-10 h-10 text-indigo-500" />}</div>
                <p className="text-gray-800 font-medium mb-6 whitespace-pre-line leading-relaxed break-keep text-sm text-left">{dialog.message}</p>
                <div className="flex justify-center gap-3">
                  {dialog.type === 'confirm' && <button onClick={closeDialog} className="px-5 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors w-full whitespace-nowrap">취소</button>}
                  <button onClick={() => { if (dialog.onConfirm) dialog.onConfirm(); closeDialog(); }} className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium shadow-sm transition-colors w-full whitespace-nowrap">확인</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
